name: Extract Backup and Move Files to Root

on:
  workflow_dispatch:

jobs:
  extract-and-flatten:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Backup File
        run: |
          curl -L -o backup.tar.gz https://github.com/hemendrabohara/bhemployment-sites/releases/download/v1.0.0/backup-7.30.2026_02-07-20_bhemploy.tar.gz

      - name: Extract Archive
        run: |
          tar -xzvf backup.tar.gz
          rm backup.tar.gz

      - name: Locate and Move public_html Files to Root
        run: |
          # 1. Find where public_html actually lives in the extracted backup
          PUBLIC_DIR=$(find . -type d -name "public_html" | head -n 1)

          if [ -n "$PUBLIC_DIR" ]; then
            echo "Found public_html at $PUBLIC_DIR"
            
            # Remove nested .git folders to avoid broken blue submodule folders
            find "$PUBLIC_DIR" -name ".git" -exec rm -rf {} + || true
            
            # Copy all files (including hidden dotfiles) from public_html to repository root
            shopt -s dotglob
            cp -rn "$PUBLIC_DIR"/* . || true
            
            # Remove the empty public_html and backup folders
            git rm -f --cached -r public_html || true
            rm -rf public_html homedir || true
          else
            echo "public_html folder not found!"
          fi

      - name: Commit and Push All Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add all files
          git add -A
          git commit -m "Extract and place all public_html files directly in root" || echo "No changes to commit"
          git push origin main
