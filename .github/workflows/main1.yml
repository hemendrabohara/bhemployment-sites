name: Extract Release Archive and Fix Submodules

on:
  workflow_dispatch:

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Backup File
        run: |
          curl -L -o backup.tar.gz https://github.com/hemendrabohara/bhemployment-sites/releases/download/v1.0.0/backup-7.30.2026_02-07-20_bhemploy.tar.gz

      - name: Extract Archive
        run: |
          tar -xzvf backup.tar.gz
          rm backup.tar.gz

      # Fix for the blue unclickable folder issue
      - name: Remove Nested Git Metadata
        run: |
          # 1. Clear git index cache for public_html if treated as submodule
          git rm --cached -r public_html || true
          
          # 2. Find and delete any hidden .git folders inside public_html
          find public_html -name ".git" -exec rm -rf {} + || true
          rm -f .gitmodules || true

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix public_html folder and commit contents" || echo "No changes to commit"
          git push origin main
