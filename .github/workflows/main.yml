name: Unsubmodule and Extract All Files

on:
  workflow_dispatch:

jobs:
  fix-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Explicitly checkout main branch to avoid detached HEAD errors
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Backup File
        run: |
          curl -L -o backup.tar.gz https://github.com/hemendrabohara/bhemployment-sites/releases/download/v1.0.0/backup-7.30.2026_02-07-20_bhemploy.tar.gz

      - name: Extract Archive
        run: |
          tar -xzvf backup.tar.gz
          rm -f backup.tar.gz

      - name: Clean Submodules and Extract Files
        run: |
          # 1. Remove all hidden .git folders inside extracted files
          find . -maxdepth 4 -name ".git" -not -path "./.git*" -exec rm -rf {} + 2>/dev/null || true

          # 2. Untrack public_html safely without failing if it doesn't exist
          if git ls-files --error-unmatch public_html >/dev/null 2>&1; then
            git rm --cached -r -f public_html || true
          fi
          rm -f .gitmodules

          # 3. Find public_html directory inside the archive
          PUBLIC_DIR=$(find . -type d -name "public_html" | head -n 1)

          if [ -n "$PUBLIC_DIR" ]; then
            echo "Found public_html at $PUBLIC_DIR"
            shopt -s dotglob
            cp -rn "$PUBLIC_DIR"/* . || true
            rm -rf public_html homedir || true
          fi

      - name: Commit and Push Clean Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all files
          git add -A
          
          # Commit and push
          git commit -m "Extract all website files to root and clear submodules" || echo "Nothing to commit"
          git push origin main
